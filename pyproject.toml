[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "antares"
version = "0.0.1"
description = "Calibrate a simulator to one specific robot from its own logs, and see the sim-to-real gap close."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pyarrow>=15",
    "huggingface_hub>=0.24",
    "mujoco>=3.2",
    "cma>=3.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
antares = "antares.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs real MuJoCo replays; slower than unit tests"]
